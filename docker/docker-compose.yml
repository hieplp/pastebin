services:
  postgres:
    image: postgres:17-alpine
    container_name: pastebin-postgres
    environment:
      POSTGRES_DB: pastebin
      POSTGRES_USER: pastebin
      POSTGRES_PASSWORD: pastebin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastebin -d pastebin"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: pastebin-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pastebin
      MINIO_ROOT_PASSWORD: pastebin
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pastebin-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: pastebin-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 pastebin pastebin && mc mb --ignore-existing local/pastebin

volumes:
  postgres_data:
  minio_data:
