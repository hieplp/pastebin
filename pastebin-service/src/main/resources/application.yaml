server:
  port: 9000
spring:
  application:
    name: pastebin-service
  datasource:
    url: jdbc:postgresql://localhost:5432/pastebin
    username: pastebin
    password: pastebin
  jpa:
    hibernate:
      # schema is owned by Flyway (db/migration); validate catches drift
      ddl-auto: validate
    open-in-view: false
  flyway:
    # pre-Flyway DBs (Hibernate-created schema, no history table) baseline at V1
    baseline-on-migrate: true
    baseline-version: 1
pastebin:
  storage:
    type: ${PASTEBIN_STORAGE_TYPE:local}
    local:
      root: uploads
    s3:
      bucket: ${S3_BUCKET:pastebin}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:pastebin}
      secret-key: ${S3_SECRET_KEY:pastebin}
      endpoint: ${S3_ENDPOINT:http://127.0.0.1:9002}
      path-style: true
  cleanup:
    expired-paste-cron: "0 0 * * * *"
    # weekly orphan-file sweep: Sunday 03:00
    orphan-cron: "0 0 3 * * SUN"
  jwt:
    issuer: pastebin
    access-ttl: 15m
    refresh-ttl: 7d
    access-cookie-name: access_token
    refresh-cookie-name: refresh_token
    cookie-secure: false
    cookie-same-site: Lax
    cookie-path: /
    private-key: ${JWT_PRIVATE_KEY:classpath:jwt/private.pem}
    public-key: ${JWT_PUBLIC_KEY:classpath:jwt/public.pem}
